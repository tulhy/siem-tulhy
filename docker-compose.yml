services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tulhy
      POSTGRES_USER: tulhy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tulhy -d tulhy']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://tulhy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/tulhy
      SIEM_ADMIN_TOKEN: ${SIEM_ADMIN_TOKEN:?Set SIEM_ADMIN_TOKEN in .env}
      SIEM_HEARTBEAT_TIMEOUT: ${SIEM_HEARTBEAT_TIMEOUT:-120}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./rules:/app/rules:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      SIEM_DOMAIN: ${SIEM_DOMAIN:?Set SIEM_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: {condition: service_healthy}
    networks: [backend, edge]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  backend: {internal: true}
  edge: {}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
